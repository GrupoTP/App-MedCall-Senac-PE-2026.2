# Texts of the error codes (grupotp.medcall.common.api.ErrorCode), in Brazilian Portuguese.
# Read as UTF-8. Formatted with java.text.MessageFormat: {0} is the first argument, and a single
# quote must be written twice ('').
SESSION_EXPIRED=Sua sessão expirou. Entre de novo para continuar.
WRONG_CREDENTIALS=E-mail ou senha incorretos.
EMAIL_TAKEN=E-mail já cadastrado.
FULL_NAME_REQUIRED=Nome completo é obrigatório.
EMAIL_INVALID=Informe um e-mail válido.
PASSWORD_TOO_SHORT=Mínimo {0} caracteres.
CURRENT_PASSWORD_WRONG=Senha atual incorreta.
PASSWORD_UNCHANGED=A nova senha precisa ser diferente da atual.
PRIMARY_PHONE_REQUIRED=Telefone principal é obrigatório.
PHONE_INVALID=Telefone inválido.
PRIVACY_POLICY_REQUIRED=Leitura da Política de Privacidade é obrigatória.
TREATMENT_CONSENT_REQUIRED=Consentimento de tratamento de dados é necessário.
BIRTH_DATE_REQUIRED=Informe sua data de nascimento.
BIRTH_DATE_INVALID=Informe uma data de nascimento válida.
REASON_REQUIRED=Descreva o motivo da consulta.
INTENSITY_OUT_OF_RANGE=Intensidade deve ser de {0} a {1}.
TEXT_TOO_LONG=Texto muito longo. Use até {0} caracteres.
INVALID_CHOICE=Especialidade, profissional ou clínica inválidos.
CLINIC_REQUIRED=Escolha a clínica do horário.
DATE_UNAVAILABLE=Escolha uma data disponível.
TIME_UNAVAILABLE=Escolha um horário disponível.
SLOT_TAKEN=Este horário acabou de ser ocupado. Escolha outro horário.
PRE_TRIAGE_NOT_FOUND=Pré-triagem não encontrada.
PRE_TRIAGE_ALREADY_ATTACHED=Esta pré-triagem já está vinculada a outra consulta.
APPOINTMENT_NOT_FOUND=Consulta não encontrada.
APPOINTMENT_NOT_CANCELLABLE=Esta consulta não pode mais ser cancelada.
FORBIDDEN=Seu perfil não tem acesso a esta função.
PASSWORD_CHANGE_REQUIRED=Troque a senha provisória antes de continuar.
APPOINTMENT_CHANGED=Este agendamento acabou de ser alterado por outra pessoa. Atualize a lista.
APPOINTMENT_TRANSITION_INVALID=Esta ação não vale para a situação atual do agendamento.
DECLINE_REASON_REQUIRED=Escolha o motivo da recusa.
ATTENDANCE_TOO_EARLY=Só dá para registrar comparecimento depois do horário da consulta.
ATTENDANCE_UNDO_EXPIRED=O registro de comparecimento só pode ser desfeito em até 24 horas.
PERIOD_INVALID=Período inválido. Use datas no formato AAAA-MM-DD, com o início antes do fim e no máximo {0} dias.
USER_NOT_FOUND=Usuário não encontrado.
LAST_ADMIN=A clínica precisa de pelo menos um administrador ativo.
CANNOT_CHANGE_SELF=Você não pode desativar nem mudar o próprio perfil.
ROLE_INVALID=Perfil inválido para esta clínica.
NAME_REQUIRED=Informe o nome.
CLINIC_NOT_FOUND=Clínica não encontrada.
TIME_ZONE_INVALID=Fuso horário inválido.
CLINIC_NOT_READY=Para ativar a clínica, cadastre pelo menos um profissional e um administrador.
PROFESSIONAL_NOT_FOUND=Profissional não encontrado.
SPECIALTY_NOT_FOUND=Especialidade não encontrada.
WEBHOOK_NOT_FOUND=Webhook não encontrado.
WEBHOOK_URL_INVALID=Use uma URL HTTPS pública. Endereços internos não são aceitos.
WEBHOOK_EVENTS_REQUIRED=Escolha pelo menos um evento.
API_KEY_INVALID=Chave de API inválida ou revogada.
API_KEY_NOT_FOUND=Chave de API não encontrada.
API_KEY_LIMIT=A clínica já tem {0} chaves ativas. Revogue uma antes de criar outra.
IDEMPOTENCY_KEY_REUSED=Esta Idempotency-Key já foi usada com outro pedido.
RATE_LIMITED=Muitas requisições. Tente de novo em instantes.
