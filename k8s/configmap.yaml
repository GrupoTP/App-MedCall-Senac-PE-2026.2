# Configuração NÃO secreta do servidor. A senha do banco e o JWT_SECRET ficam no
# SealedSecret medcall-secrets (sealedsecret.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: medcall-config
data:
  # MySQL compartilhado do host a-ca (mysql.service), o mesmo dos apps do polyclub.
  # O usuário medcall só aceita conexões vindas dos pods (10.42.0.%).
  # A senha fica no SealedSecret medcall-mysql-credenciais.
  DATABASE_DRIVER: com.mysql.cj.jdbc.Driver
  DATABASE_JDBC_URL: "jdbc:mysql://a.ca.node.polyclub.games:3306/medcall?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true"
  DATABASE_USER: medcall
  # O PWA e a API ficam no mesmo host.
  CORS_ALLOWED_ORIGINS: https://medcall.grupotp.polyclub.com.br
  SESSION_IDLE_DAYS: "180"
  # Caixa Mailpit no proprio cluster. Sem usuario e sem senha.
  # O endereco de origem e inventado. Nao e uma caixa de e-mail real.
  MAIL_MODE: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
  MAIL_FROM: medcall@medcall.grupotp.polyclub.com.br
