# MedCall — GitOps em medcall.grupotp.polyclub.com.br (node a, a-ca).
# Gerenciado pelo ArgoCD (Application em ../argocd/application.yaml, aplicada à mão no a-ca).
# Este diretório é PÚBLICO: nenhum segredo em texto puro aqui. O JWT_SECRET (sealedsecret.yaml)
# e a senha do MySQL (sealedsecret-medcall-mysql-credenciais.yaml) só como SealedSecret,
# que só o controller sealed-secrets do cluster consegue abrir.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: medcall

labels:
  - pairs:
      app.kubernetes.io/part-of: medcall
    includeSelectors: false

resources:
  - namespace.yaml
  - configmap.yaml
  - sealedsecret.yaml
  - sealedsecret-medcall-mysql-credenciais.yaml
  - server.yaml
  - web.yaml
  - ingress.yaml

images:
  # Imagens públicas no ghcr.io, publicadas pelo workflow .github/workflows/publish-images.yml.
  # Tag FIXADA (sem ArgoCD Image Updater): sha-<7 chars> do commit que gerou a imagem
  # (aba Actions ou página do pacote).
  # TODO(SPM-74): estas imagens (medcall-server e medcall-web) ainda não existem com tag sha-*:
  # depois do merge o workflow publica as duas; trocar `latest` pela tag sha-<7 chars> do build.
  # Para atualizar o app depois: novo commit -> novo build -> trocar as tags aqui.
  - name: ghcr.io/grupotp/medcall-server
    newTag: latest
  - name: ghcr.io/grupotp/medcall-web
    newTag: latest
