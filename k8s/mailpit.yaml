# Caixa local do cluster. Sem senha e sem porta publica.
# O codigo de recuperacao chega aqui. Ninguem le essa caixa pela internet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      nodeSelector:
        kubernetes.io/hostname: a
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.34.0
          ports:
            - name: smtp
              containerPort: 1025
            - name: ui
              containerPort: 8025
          env:
            - name: MP_SMTP_AUTH_ACCEPT_ANY
              value: "1"
            - name: MP_SMTP_AUTH_ALLOW_INSECURE
              value: "1"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  selector:
    app: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: ui
      port: 8025
      targetPort: ui
