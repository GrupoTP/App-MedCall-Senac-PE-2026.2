# Publica as imagens da MedCall no GitHub Container Registry (ghcr.io):
#   ghcr.io/grupotp/medcall-server  servidor Ktor (porta 8080)
#   ghcr.io/grupotp/medcall-web     PWA (export web do Expo) servido pelo nginx (porta 8080)
# Usa só o GITHUB_TOKEN automático. O submódulo é público e vem por HTTPS.
name: Publish images

on:
  push:
    branches: [main]
    paths:
      - "medcall/**"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

env:
  # Endereço público da API, gravado no bundle do PWA (mesmo host do app).
  API_BASE_URL: https://medcall.grupotp.polyclub.com.br

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: server
            image: ghcr.io/grupotp/medcall-server   # ghcr exige minúsculas
            title: MedCall (servidor)
          - target: web
            image: ghcr.io/grupotp/medcall-web
            title: MedCall (PWA)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # O .gitmodules usa a URL SSH (git@github.com:...), que o runner não tem como usar.
      # O insteadOf troca por HTTPS só neste comando, sem mexer no .gitmodules.
      - name: Submódulo por HTTPS
        run: |
          git -c url."https://github.com/".insteadOf="git@github.com:" \
            submodule update --init --depth 1 medcall/grupotp-kotlin-react-native

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados (tags e labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=${{ matrix.title }}

      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: medcall
          target: ${{ matrix.target }}
          build-args: |
            API_BASE_URL=${{ env.API_BASE_URL }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  # Depois que as duas imagens sobem, grava a tag sha-<7> no k8s/kustomization.yaml
  # e faz o commit na main. O ArgoCD vê o commit e leva a versão nova para produção.
  # O commit não dispara este workflow de novo: o GITHUB_TOKEN não dispara workflows
  # e k8s/ fica fora do filtro de paths.
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout da main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Fixar a tag nova
        id: tag
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          sed -i -E "s/^( *newTag: ).*/\1$TAG/" k8s/kustomization.yaml
          git diff --stat

      - name: Commit na main
        run: |
          if git diff --quiet; then
            echo "As tags já estão em ${{ steps.tag.outputs.tag }}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deploy): pin MedCall images to ${{ steps.tag.outputs.tag }}"
          # Outro commit pode ter entrado na main durante o build.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
